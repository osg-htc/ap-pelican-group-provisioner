[project]
name = "ap-pelican-group-provisioner"
version = "0.1.0"
description = "Synchronize LDAP users and groups into a Pelican Origin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "ldap3>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
]

[project.scripts]
sync-collections = "provisioner.jobs:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provisioner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "origin: needs the Pelican Origin started by scripts/test-origin.sh (skipped when it is not running)",
]
